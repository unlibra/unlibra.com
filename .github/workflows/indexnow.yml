# Tells IndexNow which pages a push to main changed, once Workers Builds has
# put it in production (scripts/indexnow.mjs; SP-18). Search engines
# keep crawling as before; IndexNow only tells them sooner, and only about
# pages whose content changed, as IndexNow asks.
#
# Read-only and without secrets: the IndexNow key is public (/<key>.txt).
# Third-party actions: official actions/* only, pinned to the commit of a
# release tag (the tag is in the comment).
name: IndexNow

on:
  push:
    branches: [main]
    # Files no page is built from: a push that changes only these does not
    # run (tests/indexnow.test.js checks that none feeds the build). "*.md"
    # is the top folder only, not src/pages/privacy.md.
    paths-ignore:
      - "tests/**"
      - "*.md"
      - ".github/**"
      - "eslint.config.js"
      - "playwright.config.js"
      - ".prettierrc"

permissions:
  contents: read

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  notify:
    name: notify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # A new branch or a rewritten history has no commit to compare with.
    if: github.event.before != '0000000000000000000000000000000000000000' && !github.event.forced
    env:
      BEFORE: ${{ github.event.before }}
      AFTER: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Build the pushed commit
        run: |
          npm ci
          npm run build
          mv dist "$RUNNER_TEMP/after"

      - name: Build the commit before the push
        run: |
          git worktree add "$RUNNER_TEMP/before-src" "$BEFORE"
          cd "$RUNNER_TEMP/before-src"
          npm ci
          npm run build
          mv dist "$RUNNER_TEMP/before"

      - name: Find the changed pages
        id: pages
        run: |
          node scripts/indexnow.mjs "$RUNNER_TEMP/before" "$RUNNER_TEMP/after" > "$RUNNER_TEMP/urls.txt"
          cat "$RUNNER_TEMP/urls.txt"
          echo "count=$(wc -l < "$RUNNER_TEMP/urls.txt")" >> "$GITHUB_OUTPUT"

      # Production names its commit in /commit.txt. Done when it serves the
      # pushed commit or a later one (a push right after this one).
      - name: Wait for production
        if: steps.pages.outputs.count != '0'
        run: |
          for _ in $(seq 1 60); do
            live=$(curl -fsS "https://unlibra.com/commit.txt?t=$(date +%s)" | tr -d '[:space:]' || true)
            if [ "$live" = "$AFTER" ]; then exit 0; fi
            if [ -n "$live" ]; then
              git fetch -q origin main
              if git merge-base --is-ancestor "$AFTER" "$live" 2>/dev/null; then exit 0; fi
            fi
            sleep 30
          done
          echo "production does not serve $AFTER after 30 minutes (it serves ${live:-nothing})"
          exit 1

      - name: Notify IndexNow
        if: steps.pages.outputs.count != '0'
        run: xargs node scripts/indexnow.mjs --submit < "$RUNNER_TEMP/urls.txt"
