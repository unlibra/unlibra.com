# Checks the production site every day with `npm run check:prod` (pages,
# redirects, headers, robots.txt and the sitemap), so a change
# on Cloudflare's side or a broken deploy shows up as a failed run. GitHub
# mails a failed scheduled run to the user who last changed the schedule.
#
# Runs on main as checked out (the rules in public/ are the expected ones).
# The script needs no packages: Node strips the types of src/config/site.ts.
#
# GitHub turns off scheduled workflows of a public repository after 60 days
# without activity; it mails a warning first.
#
# Third-party actions: official actions/* only, pinned to the commit of a
# release tag (the tag is in the comment).
name: Production check

on:
  schedule:
    # 21:17 UTC = 06:17 JST, off the hour, when scheduled runs pile up.
    - cron: "17 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - run: node scripts/check-prod.mjs https://unlibra.com
