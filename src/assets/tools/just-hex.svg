<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Just HEX: "Just". A white circle in the middle of one color, the
       site's primary blue (#277db2). Shown in a circle (the Apps list) and
       filling a 4:3 frame (the large card): the circle stays in the middle. -->
  <rect width="100" height="100" fill="#277db2"/>
  <circle cx="50" cy="50" r="15" fill="#fff"/>
</svg>
